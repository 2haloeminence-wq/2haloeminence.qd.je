  /* ================= FONDO ================= */
  .fondo { position: fixed; inset: -20px; z-index: -3; background-size: cover; background-position: center; background-color: #07050d; }
  .fondo.animado {
    background:
      radial-gradient(900px 600px at 15% 10%, rgba(181,123,255,.35), transparent 60%),
      radial-gradient(800px 600px at 90% 30%, rgba(91,140,255,.30), transparent 60%),
      radial-gradient(900px 700px at 50% 100%, rgba(255,90,170,.22), transparent 60%),
      #07050d;
    animation: respirar 14s ease-in-out infinite alternate;
  }
  @keyframes respirar { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(40deg); } }

  /* ================= ENTRADA ================= */

  .mute { position: fixed; left: 14px; top: 14px; z-index: 40; display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,.28); border-radius: 14px; padding: 4px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  /* ================= PERFIL ================= */
  .perfil { text-align: center; width: 100%; display: grid; justify-items: center; gap: 4px; }
  @property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  .avatar-caja { position: relative; width: 124px; height: 124px; margin-bottom: 10px;
    --m1: #b57bff; --m2: #5b8cff; --m3: #ff5aaa; --mg: 3px; --ms: 2px; --mv: 6s; --mr: 50%; --mrr: 50%; }
  /* el marco es un anillo hueco (se ve cualquier fondo por el espacio) */
  .avatar-caja[class*="marco-"]::before, .avatar-caja.marco-doble::after {
    content: ""; position: absolute; pointer-events: none; z-index: 1;
    inset: calc(-1 * (var(--ms) + var(--mg))); border-radius: var(--mrr); padding: var(--mg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  .avatar-caja.marco-ninguno::before { display: none; }
  .avatar-caja.marco-solido::before { background: var(--m1); }
  .avatar-caja.marco-degradado::before { background: linear-gradient(135deg, var(--m1), var(--m2), var(--m3)); }
  .avatar-caja.marco-giratorio::before { background: conic-gradient(from var(--ang), var(--m1), var(--m2), var(--m3), var(--m1)); animation: marcoGira var(--mv) linear infinite; }
  .avatar-caja.marco-arcoiris::before { background: conic-gradient(from var(--ang), #ff3b3b, #ffb53b, #f5ff3b, #3bff6a, #3bd5ff, #5b3bff, #ff3bd5, #ff3b3b); animation: marcoGira var(--mv) linear infinite; }
  .avatar-caja.marco-punteado::before { background: repeating-conic-gradient(from var(--ang), var(--m1) 0 5deg, transparent 5deg 10deg); animation: marcoGira var(--mv) linear infinite; }
  .avatar-caja.marco-guiones::before { background: repeating-conic-gradient(from var(--ang), var(--m1) 0 16deg, transparent 16deg 28deg); animation: marcoGira var(--mv) linear infinite; }
  .avatar-caja.marco-doble::before { background: var(--m1); }
  .avatar-caja.marco-doble::after { inset: calc(-2 * (var(--ms) + var(--mg))); border-radius: var(--mrr2, var(--mrr)); background: var(--m2); }
  .avatar-caja.marco-pulso::before { background: var(--m1); animation: marcoPulso var(--mv) ease-in-out infinite; }
  .avatar-caja.marco-alterna::before { background: var(--m1); animation: marcoAlterna var(--mv) ease-in-out infinite alternate; }
  .avatar-caja.marco-neon::before { display: none; }
  .avatar-caja.marco-neon::after { content: ""; position: absolute; pointer-events: none; z-index: 1; inset: calc(-1 * (var(--ms) + var(--mg))); border-radius: var(--mrr);
    border: var(--mg) solid var(--m1); box-shadow: 0 0 10px var(--m1), 0 0 24px var(--m1), inset 0 0 10px var(--m1); animation: marcoNeon 3.4s linear infinite; }
  @keyframes marcoGira { to { --ang: 360deg; } }
  @keyframes marcoPulso { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.07); opacity: .45; } }
  @keyframes marcoAlterna { from { background: var(--m1); } to { background: var(--m2); } }
  @keyframes marcoNeon { 0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; } 20%, 63% { opacity: .4; } }
  .avatar { position: relative; z-index: 2; width: 100%; height: 100%; border-radius: var(--mr, 50%); object-fit: cover; display: grid; place-items: center;
    font-size: 2.8rem; font-weight: 700; background: linear-gradient(135deg, var(--acento), var(--acento2)); box-shadow: 0 0 40px rgba(0,0,0,.4); }

  /* ================= EFECTOS DE TEXTO ================= */
  .ch { display: inline-block; white-space: pre; }
  .pal { display: inline-block; white-space: nowrap; }
  .ef-cursor::after { content: ""; display: inline-block; width: .09em; height: 1em; margin-left: .12em; vertical-align: -.1em; background: currentColor; animation: efCursor .8s steps(1) infinite; }
  @keyframes efCursor { 50% { opacity: 0; } }
  .ef-aparecer { opacity: 0; animation: efAparece .6s ease forwards; }
  @keyframes efAparece { from { opacity: 0; filter: blur(8px); } to { opacity: 1; filter: blur(0); } }
  .ef-subir { opacity: 0; animation: efSubir .55s cubic-bezier(.2,.9,.3,1.2) forwards; }
  @keyframes efSubir { from { opacity: 0; transform: translateY(.7em) scale(.8); } to { opacity: 1; transform: none; } }
  .ef-onda { animation: efOnda 1.8s ease-in-out infinite; }
  @keyframes efOnda { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.22em); } }
  .ef-glitch { position: relative; display: inline-block; }

  .ef-glitch::before { color: #ff2bd6; transform: translate(2px, 0); clip-path: inset(0 0 60% 0); animation: efGlitchA 2.6s steps(1) infinite; mix-blend-mode: screen; }
  .ef-glitch::after { color: #19e3ff; transform: translate(-2px, 0); clip-path: inset(55% 0 0 0); animation: efGlitchB 2.1s steps(1) infinite; mix-blend-mode: screen; }
  @keyframes efGlitchA { 0%, 88%, 100% { clip-path: inset(0 0 100% 0); } 90% { clip-path: inset(10% 0 55% 0); transform: translate(3px, -1px); } 94% { clip-path: inset(40% 0 30% 0); transform: translate(-3px, 1px); } 97% { clip-path: inset(0 0 70% 0); transform: translate(2px, 0); } }
  @keyframes efGlitchB { 0%, 80%, 100% { clip-path: inset(100% 0 0 0); } 83% { clip-path: inset(60% 0 10% 0); transform: translate(-3px, 1px); } 90% { clip-path: inset(20% 0 55% 0); transform: translate(3px, -1px); } 95% { clip-path: inset(75% 0 0 0); transform: translate(-2px, 0); } }
  .ef-brillo { background: linear-gradient(100deg, var(--texto) 35%, #fff 50%, var(--texto) 65%) 100% 0 / 250% 100% no-repeat; -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none !important; animation: efBrillo 3.2s linear infinite; filter: drop-shadow(0 0 12px color-mix(in srgb, var(--acento) 55%, transparent)); }
  @keyframes efBrillo { to { background-position: -50% 0; } }
  .ef-neon { animation: efNeon 3.5s linear infinite; text-shadow: 0 0 6px var(--acento), 0 0 16px var(--acento), 0 0 34px var(--acento) !important; }
  @keyframes efNeon { 0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; } 20%, 63% { opacity: .35; } }


  /* ================= CLAVE DE ACCESO ================= */
  #clave { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #07050d; padding: 20px; }
  #clave::before { content: ""; position: absolute; inset: 0; background:
    radial-gradient(800px 500px at 20% 10%, rgba(181,123,255,.22), transparent 60%),
    radial-gradient(700px 500px at 85% 90%, rgba(91,140,255,.18), transparent 60%); }

    background: var(--c-caja, rgba(255,255,255,.06)); border: 1px solid var(--c-borde, var(--borde)); border-radius: var(--c-radio, 20px);
    backdrop-filter: blur(var(--c-blur, 16px)); -webkit-backdrop-filter: blur(var(--c-blur, 16px)); box-shadow: var(--c-sombra, 0 10px 40px rgba(0,0,0,.5)); }

  .clave-caja input { width: 100%; padding: 12px 14px; border-radius: var(--c-in-radio, 12px); border: 1px solid var(--c-in-borde, var(--borde)); background: var(--c-in-bg, rgba(0,0,0,.35)); color: var(--c-in-txt, var(--texto)); font-size: 1rem; text-align: center; outline: none; }

const $ = (s) => document.querySelector(s);

function h(tag, props) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const kids = [].concat(arguments[i]).flat(Infinity);
    kids.forEach(function (c) {
      if (c == null || c === false) return;
      el.append(c.nodeType ? c : document.createTextNode(String(c)));
    });
  }
  return el;
}

function fusionar(base, extra) {
  const out = JSON.parse(JSON.stringify(base));
  function mezclar(dst, src) {
    for (const k in src) {
      const v = src[k];
      if (v && typeof v === "object" && !Array.isArray(v) && dst[k] && typeof dst[k] === "object" && !Array.isArray(dst[k])) mezclar(dst[k], v);
      else dst[k] = v;
    }
  }
  if (extra) mezclar(out, extra);
  return out;
}

function fmt(s) {
  if (!isFinite(s)) return "0:00";
  const m = Math.floor(s / 60), r = Math.floor(s % 60);

}

const EFECTOS = [["ninguno", "Sin efecto"], ["maquina", "Máquina de escribir"], ["aparecer", "Letra por letra (aparecen)"], ["subir", "Letras que suben"], ["onda", "Ondas"], ["glitch", "Glitch"], ["brillo", "Brillo que pasa"], ["neon", "Neón parpadeante"]];
const efectoEls = new Set();
function appVisible() { return $("#app").classList.contains("visible"); }
function sinMovimiento() { return false; }  // los efectos los elige el dueño de la página: siempre se ven

function limpiarEfecto(el) {
  (el._t || []).forEach(function (t) { clearTimeout(t); clearInterval(t); });
  el._t = [];
  el.className = el.className.split(" ").filter(function (c) { return c.indexOf("ef-") !== 0; }).join(" ");
  el.removeAttribute("data-t");
}
function porLetras(el, texto, clase, paso, extra) {
  el.textContent = "";
  let n = 0;
  texto.split(/(\s+)/).forEach(function (tok) {
    if (!tok) return;
    if (/^\s+$/.test(tok)) {
      const saltos = (tok.match(/\n/g) || []).length;
      if (saltos) for (let i = 0; i < saltos; i++) el.append(document.createElement("br"));
      else el.append(document.createTextNode(" "));
      return;
    }
    const w = h("span", { class: "pal" });
    Array.from(tok).forEach(function (c) {
      const sp = h("span", { class: "ch " + clase, text: c });
      sp.style.animationDelay = (n * paso) + "ms";
      if (extra) extra(sp, n);
      n++; w.append(sp);
    });
    el.append(w);
  });
}
function correrEfecto(el) {
  const texto = el._texto || "", ef = el._ef || "ninguno", vel = Number(D.efectos.velocidad) || 55;
  limpiarEfecto(el);
  if (ef === "ninguno" || sinMovimiento() || !texto) { el.textContent = texto; return; }
  if (ef === "maquina") {
    el.classList.add("ef-cursor");
    const letras = Array.from(texto);
    let i = 0, borrando = false;
    el.textContent = "";
    const id = setInterval(function () {
      if (!borrando) {
        i++; el.textContent = letras.slice(0, i).join("");
        if (i >= letras.length) {
          if (D.efectos.repetir) { clearInterval(id); el._t.push(setTimeout(function () { borrando = true; el._t.push(setInterval(function () {
              i--; el.textContent = letras.slice(0, Math.max(i, 0)).join("");
              if (i <= 0) { limpiarEfecto(el); correrEfecto(el); }
            }, Math.max(15, vel / 2))); }, 2200)); }
          else clearInterval(id);
        }
      }
    }, vel);
    el._t.push(id);
  } else if (ef === "aparecer") porLetras(el, texto, "ef-aparecer", vel);
  else if (ef === "subir") porLetras(el, texto, "ef-subir", vel);
  else if (ef === "onda") porLetras(el, texto, "ef-onda", 90);
  else if (ef === "glitch") { el.textContent = texto; el.setAttribute("data-t", texto); el.classList.add("ef-glitch"); }
  else if (ef === "brillo") { el.textContent = texto; el.classList.add("ef-brillo"); }
  else if (ef === "neon") { el.textContent = texto; el.classList.add("ef-neon"); }
}
function efecto(el, texto, ef, siempre) {
  efectoEls.add(el);
  const clave = [ef, texto, D.efectos.velocidad, D.efectos.repetir].join("|");
  if (el._clave === clave) return;
  el._clave = clave; el._texto = texto || ""; el._ef = ef || "ninguno";
  if (!siempre && !appVisible()) { limpiarEfecto(el); el.textContent = el._texto; el._pend = true; return; }
  correrEfecto(el);
}
function lanzarEfectos() {
  efectoEls.forEach(function (el) { if (el._pend) { el._pend = false; correrEfecto(el); } });
}
function repetirEfectos() { efectoEls.forEach(function (el) { correrEfecto(el); }); }

async function driveGet(url) {

}
async function driveListar(carpetaId, key) {
  let out = [], token = "";
  do {
    const url = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent("'" + carpetaId + "' in parents and trashed=false") +
      "&fields=" + encodeURIComponent("nextPageToken,files(id,name,mimeType,thumbnailLink,createdTime)") +

    const j = await driveGet(url);
    out = out.concat(j.files || []); token = j.nextPageToken || "";

}
async function cargarCarpeta(id, nombre, key, grupos, prof) {

function posicionar(el, s) {
  el.style.left = s.x + "%"; el.style.top = s.y + "%";
  el.style.width = s.ancho + "px";
  el.style.setProperty("--rot", (s.rotacion || 0) + "deg");

function seleccionar(id) {

function activarArrastre(el, s) {
  el.addEventListener("pointerdown", function (e) {
    if (!(modoEditar || s.modo === "arrastrar")) return;
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const dx = e.clientX - (s.x / 100) * innerWidth, dy = e.clientY - (s.y / 100) * innerHeight;
    el.style.zIndex = ++zTop; el.arrastrando = true;
    if (modoEditar) seleccionar(s.id);
    function mover(ev) {
      s.x = Math.min(100, Math.max(0, ((ev.clientX - dx) / innerWidth) * 100));
      s.y = Math.min(100, Math.max(0, ((ev.clientY - dy) / innerHeight) * 100));
      posicionar(el, s);
    }
    function soltar() {
      el.arrastrando = false;
      el.removeEventListener("pointermove", mover); el.removeEventListener("pointerup", soltar); el.removeEventListener("pointercancel", soltar);
      if (modoEditar) { sucio = true; if (typeof actualizarEstado === "function") actualizarEstado(); }
    }
    el.addEventListener("pointermove", mover); el.addEventListener("pointerup", soltar); el.addEventListener("pointercancel", soltar);
  });
}

  const capa2 = $("#clave-stickers"); capa2.innerHTML = "";

    if (s.modo === "arrastrar") el.classList.add("mov");
    if (par[2]) el.style.zIndex = s.delante ? 3 : 1;
    el._s = s; el._ox = 0; el._oy = 0; el._fase = Math.random() * 6.28;
    posicionar(el, s); activarArrastre(el, s);
    if (s.id === seleccionado && modoEditar) el.classList.add("sel");
    par[1].append(el); stickerEls.push(el);

let mx = -1e5, my = -1e5;
addEventListener("pointermove", function (e) { mx = e.clientX; my = e.clientY; }, { passive: true });

function bucle(t) {
  let activo = modoEditar;
  for (let i = 0; i < stickerEls.length; i++) {
    const el = stickerEls[i], s = el._s;
    let tx = 0, ty = 0;
    if (el.arrastrando || s.flotar || s.modo === "esquivar" || s.modo === "atraer" || Math.abs(el._ox) > 0.01 || Math.abs(el._oy) > 0.01) activo = true;
    if (!modoEditar && !el.arrastrando) {
      if (s.modo === "esquivar" || s.modo === "atraer") {
        const cx = (s.x / 100) * innerWidth, cy = (s.y / 100) * innerHeight;
        const dx = cx - mx, dy = cy - my, d = Math.hypot(dx, dy) || 1, R = Math.max(130, s.ancho * 1.6);
        if (d < R) {
          const f = 1 - d / R, fz = s.fuerza || 90;
          if (s.modo === "esquivar") { tx = (dx / d) * f * fz; ty = (dy / d) * f * fz; }
          else { const mag = Math.min(f * fz, d * 0.7); tx = (-dx / d) * mag; ty = (-dy / d) * mag; }
        }
      }
      if (s.flotar) { ty += Math.sin(t / 900 + el._fase) * 6; tx += Math.cos(t / 1300 + el._fase) * 3; }
    }
    const nx = el._ox + (tx - el._ox) * 0.12, ny = el._oy + (ty - el._oy) * 0.12;
    if (Math.abs(nx - el._ox) > 0.01 || Math.abs(ny - el._oy) > 0.01 || tx || ty) {
      el._ox = nx; el._oy = ny;
      el.style.setProperty("--ox", nx.toFixed(2) + "px"); el.style.setProperty("--oy", ny.toFixed(2) + "px");
    }
  }
  if (activo) requestAnimationFrame(bucle);
  else setTimeout(function () { requestAnimationFrame(bucle); }, 250);
}

let claveActual = "";
const TXT = new TextEncoder(), DEC = new TextDecoder();
function haySeguro() { return !!(window.crypto && crypto.subtle); }
function aB64(buf) { let t = ""; new Uint8Array(buf).forEach(function (b) { t += String.fromCharCode(b); }); return btoa(t); }
function deB64(t) { const r = atob(t), a = new Uint8Array(r.length); for (let i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }

async function abrirProtegido(aes) {
  const p = D.protegido;
  if (!p || !p.datos) return;
  const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: deB64(p.iv) }, aes, deB64(p.datos));
  const j = JSON.parse(DEC.decode(claro));

  if (j.videos) D.videos = j.videos;
}
/* arma el JSON que se guarda: si hay clave, los videos van cifrados */
async function armarSalida() {
  const salida = JSON.parse(JSON.stringify(D));
  const hc = D.handycamClave;
  if (hc && hc.activo) {
    if (!hcOk || !hcClaveActual) throw new Error("La handycam tiene clave: desbloqueala en la página (sección Handycam) antes de guardar, así no se pierden los videos.");
    const dd = await derivar(hcClaveActual, hc.salt);
    const iv2 = crypto.getRandomValues(new Uint8Array(12));
    const ct2 = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv2 }, dd.aes, TXT.encode(JSON.stringify({ drive: D.drive, videos: D.videos })));
    salida.handycamClave.iv = aB64(iv2); salida.handycamClave.datos = aB64(ct2);
    salida.drive = { apiKey: "", carpetas: [] };
    salida.videos = [];
    delete salida.protegido;
    return salida;
  }
  if (salida.handycamClave) { salida.handycamClave.iv = ""; salida.handycamClave.datos = ""; }
  if (D.acceso.activo) {
    if (!claveActual) throw new Error("Falta la clave. Entrá de nuevo con la clave o ponela otra vez en 🔒 Acceso con clave.");
    const d = await derivar(claveActual, D.acceso.salt);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, d.aes, TXT.encode(JSON.stringify({ drive: D.drive, videos: D.videos })));
    salida.protegido = { iv: aB64(iv), datos: aB64(ct) };
    salida.drive = { apiKey: "", carpetas: [] };
    salida.videos = [];
  } else {
    delete salida.protegido;
  }
  return salida;
}
function pedirClave() {

    btn.textContent = D.textos.claveBoton;
    caja.classList.remove("oculto-del");
    document.body.classList.add("bloqueado");
    if (!haySeguro()) {

/* ----- subir archivos (quedan pendientes hasta "Guardar") ----- */
function reducirImagen(file, max, tipo) {
  return new Promise(function (ok, mal) {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { URL.revokeObjectURL(url); b ? ok(b) : mal(new Error("No se pudo procesar la imagen")); }, tipo, 0.9);
    };
    img.onerror = function () { mal(new Error("Imagen inválida")); };
    img.src = url;
  });
}

async function adjuntar(file, carpeta, max) {
  const punto = file.name.lastIndexOf(".");
  const base = limpiarNombre(punto > 0 ? file.name.slice(0, punto) : file.name);
  let ext = punto > 0 ? file.name.slice(punto + 1).toLowerCase() : "bin";
  let blob = file;
  if (max && /^image\//.test(file.type) && file.type !== "image/gif" && file.type !== "image/svg+xml") {
    const tipo = file.type === "image/jpeg" ? "image/jpeg" : "image/png";
    blob = await reducirImagen(file, max, tipo);
    ext = tipo === "image/jpeg" ? "jpg" : "png";
  }
  if (blob.size > 24 * 1024 * 1024) throw new Error("El archivo pesa más de 24 MB. Usá uno más liviano.");
  const ruta = carpeta + "/" + Date.now().toString(36) + "-" + base + "." + ext;
  pendientes[ruta] = { blob: blob, blobUrl: URL.createObjectURL(blob), subido: false };
  return ruta;
}
async function subir(file, carpeta, max, alTerminar) {
  try { setEstado("Preparando archivo…"); const r = await adjuntar(file, carpeta, max); alTerminar(r); sucio = true; actualizarEstado(); }
  catch (e) { setEstado(e.message, "mal"); }
}

function seccionAcceso() {
  const a = D.acceso;

  const poner = async function () {
    if (!haySeguro()) { setEstado("La clave solo funciona con https (candado). Esperá a que esté listo el certificado.", "mal"); return; }
    const v = inp.value;
    if (v.length < 6) { setEstado("La clave tiene que tener al menos 6 caracteres", "mal"); return; }
    setEstado("Preparando la clave…");
    const salt = aB64(crypto.getRandomValues(new Uint8Array(16)));
    const d = await derivar(v, salt);
    D.acceso = { activo: true, salt: salt, hash: d.verif };
    claveActual = v;
    try { sessionStorage.setItem("clave-sitio", v); } catch (e) {}
    sucio = true; renderEditor();
    setEstado("Clave lista. Tocá Guardar y publicar para activarla.", "bien");
  };

    D.acceso = { activo: false, salt: "", hash: "" };

    sucio = true; renderEditor();
    setEstado("Clave desactivada. Tocá Guardar y publicar para dejar la página pública.", "bien");

function errorGitHub(estado, detalle) {
  if (estado === 401) return "El token no es válido o venció. Creá uno nuevo.";
  if (estado === 403 || estado === 404) return "El token no tiene acceso a este repositorio (o los datos de conexión están mal). Revisá usuario, repositorio y que el permiso sea Contents: Read and write.";
  if (estado === 409) return "Hubo un choque con otro cambio. Probá guardar de nuevo.";
  if (estado === 422) return "GitHub rechazó el archivo. " + (detalle || "");
  return "Error de GitHub (" + estado + ").";
}
function blobABase64(b) {
  return new Promise(function (ok, mal) {
    const r = new FileReader();
    r.onload = function () { ok(String(r.result).split(",")[1]); };
    r.onerror = function () { mal(new Error("No se pudo leer el archivo")); };
    r.readAsDataURL(b);
  });
}
function textoABase64(s) {
  const bytes = new TextEncoder().encode(s); let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
async function ghSubir(ruta, b64, mensaje) {
  const base = "https://api.github.com/repos/" + conexion.owner + "/" + conexion.repo + "/contents/" + ruta.split("/").map(encodeURIComponent).join("/");
  const cab = { Authorization: "Bearer " + conexion.token, Accept: "application/vnd.github+json" };
  let sha;
  const g = await fetch(base + "?ref=" + encodeURIComponent(conexion.branch), { headers: cab });
  if (g.ok) sha = (await g.json()).sha;
  else if (g.status !== 404) throw new Error(errorGitHub(g.status));
  const r = await fetch(base, {
    method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, cab),
    body: JSON.stringify({ message: mensaje, content: b64, branch: conexion.branch, sha: sha })
  });
  if (!r.ok) { let d = ""; try { d = (await r.json()).message; } catch (e) {} throw new Error(errorGitHub(r.status, d)); }
}

let guardando = false;
async function guardar() {
  if (guardando) return;
  if (!conexion.token) { setEstado("Falta el token (sección Conexión)", "mal"); return; }
  guardando = true; $("#ed-guardar").disabled = true;
  try {
    const lista = Object.keys(pendientes).filter(function (p) { return !pendientes[p].subido; });
    for (let i = 0; i < lista.length; i++) {
      setEstado("Subiendo archivo " + (i + 1) + " de " + lista.length + "…");
      await ghSubir(lista[i], await blobABase64(pendientes[lista[i]].blob), "Subir " + lista[i]);
      pendientes[lista[i]].subido = true;
    }
    setEstado("Guardando configuración…");
    await ghSubir("datos.json", textoABase64(JSON.stringify(await armarSalida(), null, 2)), "Actualizar la página");
    sucio = false;
    setEstado("Guardado ✓ (se ve en 1–2 minutos)", "bien");
  } catch (e) {
    setEstado(e.message || "No se pudo guardar", "mal");
  } finally {
    guardando = false; $("#ed-guardar").disabled = false;
  }
}

/* Si algo se cuelga (conexión lenta, navegador viejo, error), se avisa en vez de quedar en negro */
function avisoCarga(txt) {
  const e = document.getElementById("entrar-texto");
  if (e && !window.__listo) { e.style.letterSpacing = "normal"; e.style.fontSize = ".95rem"; e.textContent = txt; }
}
window.addEventListener("error", function (ev) { avisoCarga("Error al cargar: " + (ev.message || "desconocido") + ". Recargá la página."); });
window.addEventListener("unhandledrejection", function (ev) { avisoCarga("Error al cargar: " + ((ev.reason && ev.reason.message) || "desconocido") + ". Recargá la página."); });
setTimeout(function () { avisoCarga("Está tardando más de lo normal. Revisá tu conexión y recargá la página."); }, 15000);
iniciar().catch(function (e) { avisoCarga("Error al cargar: " + (e && e.message ? e.message : "desconocido") + ". Recargá la página."); });
