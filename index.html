<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis videos</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --text:#eef0f4; --muted:#9aa3b2; --accent:#4f8cff; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --card:#ffffff; --text:#14161a; --muted:#5b6472; --accent:#2563eb; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding:32px 16px 8px; max-width:1100px; margin:0 auto; }
  h1 { margin:0 0 6px; font-size:1.8rem; }
  header p { margin:0; color:var(--muted); }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:20px; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .video { position:relative; padding-top:56.25%; background:#000; }
  .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .info { padding:12px 14px 14px; }
  .info h2 { margin:0 0 4px; font-size:1.05rem; }
  .info small { color:var(--muted); display:block; margin-bottom:10px; }
  .btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:8px 14px; border-radius:8px; font-weight:600; font-size:.9rem; }
  .vacio { grid-column:1/-1; text-align:center; color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>Mis videos</h1>
  <p>Mirá los videos o descargá el que quieras.</p>
</header>
<main id="lista"></main>

<script>
  // ============================================================
  // AGREGÁ TUS VIDEOS ACÁ
  // Cada video es una línea con: titulo, fecha (opcional) e id.
  // El "id" es la parte larga del link de Google Drive:
  // https://drive.google.com/file/d/ESTE_ES_EL_ID/view
  // Ejemplo:
  //   { titulo: "Cumpleaños 2008", fecha: "Marzo 2008", id: "1AbCdEfGhIjKlMnOp" },
  // ============================================================
  const VIDEOS = [

  ];

  const lista = document.getElementById("lista");

  if (VIDEOS.length === 0) {
    lista.innerHTML = '<p class="vacio">Todavía no hay videos cargados.</p>';
  }

  VIDEOS.forEach(function (v) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="video"><iframe src="https://drive.google.com/file/d/' + v.id +
      '/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe></div>' +
      '<div class="info">' +
      '<h2></h2>' +
      '<small></small>' +
      '<a class="btn" href="https://drive.google.com/uc?export=download&id=' + v.id + '">Descargar</a>' +
      '</div>';
    card.querySelector("h2").textContent = v.titulo || "Sin título";
    card.querySelector("small").textContent = v.fecha || "";
    lista.appendChild(card);
  });
</script>
</body>
</html>
