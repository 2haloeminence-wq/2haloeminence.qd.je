<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargando…</title>
<style>
  :root {
    --acento: #b57bff;
    --acento2: #5b8cff;
    --texto: #f3f0fb;
    --suave: #b3aec8;
    --vidrio: rgba(16, 12, 28, .58);
    --borde: rgba(255,255,255,.12);
    --fuente-titulo: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; color: var(--texto); background: #07050d; overflow-x: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button { font-family: inherit; }

  /* ================= FONDO ================= */
  .fondo { position: fixed; inset: -20px; z-index: -3; background-size: cover; background-position: center; background-color: #07050d; }
  .fondo.animado {
    background:
      radial-gradient(900px 600px at 15% 10%, rgba(181,123,255,.35), transparent 60%),
      radial-gradient(800px 600px at 90% 30%, rgba(91,140,255,.30), transparent 60%),
      radial-gradient(900px 700px at 50% 100%, rgba(255,90,170,.22), transparent 60%),
      #07050d;
    animation: respirar 14s ease-in-out infinite alternate;
  }
  @keyframes respirar { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(40deg); } }
  .fondo-video { position: fixed; inset: -20px; width: calc(100% + 40px); height: calc(100% + 40px); object-fit: cover; z-index: -3; display: none; }
  .velo { position: fixed; inset: 0; z-index: -2; background: rgba(5,3,10,.45); }

  /* ================= ENTRADA ================= */
  #entrar {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: #07050d;
    cursor: pointer; transition: opacity .7s ease, visibility .7s; text-align: center; padding: 20px;
  }
  #entrar.oculto { opacity: 0; visibility: hidden; pointer-events: none; }
  #entrar span { font-size: 1.05rem; letter-spacing: .35em; color: var(--suave); animation: parpadeo 2.2s ease-in-out infinite; }
  @keyframes parpadeo { 50% { opacity: .35; } }

  /* ================= LAYOUT ================= */
  #app { opacity: 0; transition: opacity .9s ease; padding: 70px 16px 80px; position: relative; z-index: 10; }
  #app.visible { opacity: 1; }
  .columna { max-width: 600px; margin: 0 auto; display: grid; gap: 26px; justify-items: center; }
  .oculto-del { display: none !important; }

  /* ================= SONIDO (arriba a la izquierda) ================= */
  .mute { position: fixed; left: 14px; top: 14px; z-index: 40; display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,.28); border-radius: 14px; padding: 4px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .mute button { width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--texto); cursor: pointer; display: grid; place-items: center; }
  .mute button:hover { background: rgba(255,255,255,.12); }
  .mute svg { width: 22px; height: 22px; fill: currentColor; }
  .mute .vol-caja { width: 0; overflow: hidden; transition: width .25s ease; display: flex; align-items: center; }
  .mute:hover .vol-caja, .mute:focus-within .vol-caja { width: 96px; padding-right: 10px; }

  /* ================= PERFIL ================= */
  .perfil { text-align: center; width: 100%; display: grid; justify-items: center; gap: 4px; }
  .avatar-caja { position: relative; width: 124px; height: 124px; margin-bottom: 10px; }
  .avatar-caja.anillo::before {
    content: ""; position: absolute; inset: -5px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--acento), var(--acento2), #ff5aaa, var(--acento));
    animation: girar 6s linear infinite; filter: blur(.4px);
  }
  .avatar-caja.anillo::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; background: #0b0814; }
  .avatar { position: relative; z-index: 2; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: grid; place-items: center;
    font-size: 2.8rem; font-weight: 700; background: linear-gradient(135deg, var(--acento), var(--acento2)); box-shadow: 0 0 40px rgba(0,0,0,.4); }
  @keyframes girar { to { transform: rotate(360deg); } }
  h1 { margin: 6px 0 0; font-family: var(--fuente-titulo); font-size: 2.2rem; line-height: 1.1; letter-spacing: .01em; text-shadow: 0 0 24px color-mix(in srgb, var(--acento) 60%, transparent), 0 2px 10px rgba(0,0,0,.6); word-break: break-word; }
  .usuario { font-weight: 600; font-size: 1.05rem; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  .lugar { display: inline-flex; align-items: center; gap: 6px; color: var(--texto); font-size: .92rem; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  .lugar svg { width: 15px; height: 15px; fill: currentColor; }
  .bio { margin: 6px 0 0; color: var(--suave); line-height: 1.55; max-width: 460px; text-shadow: 0 2px 8px rgba(0,0,0,.7); white-space: pre-line; }

  .redes { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 16px; }
  .redes a {
    width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; text-decoration: none; color: var(--texto);
    font-size: .72rem; font-weight: 700; background: rgba(255,255,255,.08); border: 1px solid var(--borde);
    transition: transform .15s, background .2s, box-shadow .2s;
  }
  .redes a.texto { width: auto; padding: 0 16px; border-radius: 999px; font-size: .85rem; }
  .redes a:hover { transform: translateY(-3px); background: color-mix(in srgb, var(--acento) 28%, transparent); box-shadow: 0 0 20px color-mix(in srgb, var(--acento) 50%, transparent); }
  .redes img { width: 22px; height: 22px; filter: invert(1) brightness(1.2); }

  /* ================= REPRODUCTOR ================= */
  .player { position: relative; width: 100%; max-width: 520px; }
  .player.vacio { display: none; }
  .player-fila { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; }
  .portada { width: 56px; height: 56px; border-radius: 10px; background: linear-gradient(135deg, var(--acento), var(--acento2)) center/cover no-repeat; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
  .p-centro { min-width: 0; }
  #tema { font-weight: 700; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  #tema small { color: var(--suave); font-weight: 400; margin-left: 6px; }
  .barra-fila { display: flex; align-items: center; gap: 10px; margin-top: 4px; font-size: .78rem; color: var(--suave); font-variant-numeric: tabular-nums; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 4px; background: rgba(255,255,255,.22); outline: none; flex: 1; min-width: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px var(--acento); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; }
  .controles { display: flex; align-items: center; gap: 4px; }
  .controles button { border: 0; background: transparent; color: var(--texto); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
  .controles button:hover { background: rgba(255,255,255,.14); }
  .controles svg { width: 20px; height: 20px; fill: currentColor; }
  .lista { list-style: none; margin: 10px 0 0; padding: 6px; border-radius: 14px; max-height: 200px; overflow-y: auto; display: none;
    background: var(--vidrio); border: 1px solid var(--borde); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .lista.abierta { display: block; }
  .lista li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: .9rem; }
  .lista li:hover { background: rgba(255,255,255,.08); }
  .lista li.activa { background: color-mix(in srgb, var(--acento) 25%, transparent); }
  .lista li small { color: var(--suave); }
  @media (max-width: 520px) { .player-fila { grid-template-columns: 56px 1fr; } .controles { grid-column: 1 / -1; justify-content: center; } }

  /* ================= HANDYCAM ================= */
  .ir-handycam { color: var(--suave); font-size: .8rem; text-decoration: none; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  .ir-handycam:hover { color: var(--texto); }
  #handycam { width: 100%; scroll-margin-top: 24px; margin-top: 30px; }
  .seccion-titulo { text-align: center; }
  .seccion-titulo h2 { margin: 0; font-family: var(--fuente-titulo); font-size: 1.4rem; letter-spacing: .28em; text-transform: uppercase; text-shadow: 0 0 20px color-mix(in srgb, var(--acento) 55%, transparent); }
  .seccion-titulo p { margin: 6px 0 0; color: var(--suave); font-size: .9rem; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  .grilla { display: grid; gap: 18px; margin-top: 18px; }
  .vidrio { background: var(--vidrio); border: 1px solid var(--borde); border-radius: 20px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .video-card { overflow: hidden; }
  .miniatura { position: relative; padding-top: 56.25%; background: #000 center/cover no-repeat; cursor: pointer; }
  .miniatura::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.1)); }
  .miniatura .play { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%;
    background: rgba(255,255,255,.18); backdrop-filter: blur(6px); display: grid; place-items: center; border: 1px solid rgba(255,255,255,.35); transition: transform .2s, background .2s; }
  .miniatura:hover .play { transform: scale(1.1); background: color-mix(in srgb, var(--acento) 60%, transparent); }
  .miniatura .play svg { width: 24px; height: 24px; fill: #fff; margin-left: 3px; }
  .miniatura iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 2; }
  .video-info { padding: 14px 16px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .video-info h3 { margin: 0; font-size: 1rem; }
  .video-info small { color: var(--suave); display: block; margin-top: 2px; }
  .descargar { flex: 0 0 auto; text-decoration: none; color: #fff; font-weight: 600; font-size: .85rem; padding: 9px 15px; border-radius: 10px;
    background: linear-gradient(135deg, var(--acento), var(--acento2)); transition: filter .2s, transform .15s; }
  .descargar:hover { filter: brightness(1.15); transform: translateY(-1px); }

  /* --- handycam estilo youtube --- */
  .hc { width: 100%; margin-top: 18px; display: grid; gap: 14px; }
  .hc-barra { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hc-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; flex: 1; min-width: 0; }
  .hc-tab { flex: 0 0 auto; border: 1px solid var(--borde); background: rgba(255,255,255,.07); color: var(--suave); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: .82rem; white-space: nowrap; transition: background .2s, color .2s; }
  .hc-tab:hover { color: var(--texto); background: rgba(255,255,255,.14); }
  .hc-tab.activa { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--acento), var(--acento2)); }
  .hc-random { flex: 0 0 auto; border: 1px solid var(--borde); background: rgba(255,255,255,.1); color: var(--texto); padding: 8px 14px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: .85rem; transition: transform .15s, background .2s; }
  .hc-random:hover { background: rgba(255,255,255,.2); transform: translateY(-1px); }
  .hc-th { position: relative; padding-top: 56.25%; background: #000; overflow: hidden; cursor: pointer; }
  .hc-th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hc-th iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 3; }
  .hc-th .play { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%; z-index: 2;
    background: rgba(255,255,255,.18); backdrop-filter: blur(6px); display: grid; place-items: center; border: 1px solid rgba(255,255,255,.35); transition: transform .2s, background .2s; }
  .hc-th:hover .play { transform: scale(1.1); background: color-mix(in srgb, var(--acento) 60%, transparent); }
  .hc-th .play svg { width: 24px; height: 24px; fill: #fff; margin-left: 3px; }
  .hc-acciones { display: flex; gap: 8px; align-items: center; flex: 0 0 auto; }
  .hc-hd { border: 1px solid var(--borde); background: rgba(255,255,255,.09); color: var(--texto); padding: 9px 13px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: .85rem; }
  .hc-hd:hover { background: rgba(255,255,255,.18); }
  .hc-hd.on { background: linear-gradient(135deg, var(--acento), var(--acento2)); border-color: transparent; color: #fff; }
  .hc-th video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; z-index: 3; }
  .hc-fila { display: grid; grid-template-columns: 34px 1fr 34px; gap: 8px; align-items: center; }
  .hc-flecha { width: 34px; height: 56px; border-radius: 10px; border: 1px solid var(--borde); background: rgba(255,255,255,.08); color: var(--texto); font-size: 1.3rem; cursor: pointer; }
  .hc-flecha:hover:not(:disabled) { background: rgba(255,255,255,.18); }
  .hc-flecha:disabled { opacity: .25; cursor: default; }
  .hc-mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .hc-item { border-radius: 14px; overflow: hidden; cursor: pointer; border: 1px solid var(--borde); background: var(--vidrio); transition: transform .15s, border-color .2s; }
  .hc-item:hover { transform: translateY(-2px); }
  .hc-item.activo { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento); }
  .hc-item .t { padding: 6px 8px 8px; font-size: .72rem; line-height: 1.25; color: var(--suave); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
  .hc-item.activo .t { color: var(--texto); }
  .hc-estado { text-align: center; color: var(--suave); font-size: .85rem; }
  @media (max-width: 560px) { .hc-mini { grid-template-columns: repeat(2, 1fr); } .hc-fila { grid-template-columns: 28px 1fr 28px; } .hc-flecha { width: 28px; } }
  .sin-videos { text-align: center; color: var(--suave); padding: 30px 16px; }
  footer { text-align: center; color: var(--suave); font-size: .78rem; opacity: .75; text-shadow: 0 2px 8px rgba(0,0,0,.7); }

  /* ================= STICKERS ================= */
  #stickers { position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
  .sticker {
    position: absolute; height: auto; user-select: none; -webkit-user-drag: none; pointer-events: none; will-change: transform;
    transform: translate(-50%, -50%) translate(var(--ox, 0px), var(--oy, 0px)) rotate(var(--rot, 0deg));
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.35));
  }
  .sticker.mov { pointer-events: auto; cursor: grab; touch-action: none; }
  .sticker.mov:active { cursor: grabbing; }
  body.editando .sticker { pointer-events: auto; cursor: move; touch-action: none; outline: 1px dashed rgba(255,255,255,.35); outline-offset: 4px; }
  body.editando .sticker.sel { outline: 2px solid var(--acento); }

  @media (prefers-reduced-motion: reduce) { .fondo.animado, .avatar-caja.anillo::before { animation: none; } }

  /* ================= EDITOR (solo dueño) ================= */
  .editor {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(390px, 100%); z-index: 80; display: none; flex-direction: column;
    background: rgba(14,11,24,.96); border-left: 1px solid var(--borde); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    font-size: .88rem; color: var(--texto);
  }
  body.editando .editor { display: flex; }
  .editor.min { transform: translateX(calc(100% - 46px)); }
  .ed-cab { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--borde); }
  .ed-cab strong { font-size: 1rem; }
  #ed-estado { margin-left: auto; font-size: .78rem; color: var(--suave); text-align: right; }
  #ed-estado.mal { color: #ff8a8a; } #ed-estado.bien { color: #7be3a1; }
  .ed-cab button { background: rgba(255,255,255,.08); border: 0; color: var(--texto); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; }
  .ed-cuerpo { overflow-y: auto; padding: 8px 12px 16px; flex: 1; }
  .editor details { border: 1px solid var(--borde); border-radius: 12px; margin: 8px 0; background: rgba(255,255,255,.03); }
  .editor summary { cursor: pointer; padding: 10px 12px; font-weight: 700; list-style: none; }
  .editor summary::-webkit-details-marker { display: none; }
  .editor summary::before { content: "▸ "; color: var(--suave); }
  .editor details[open] > summary::before { content: "▾ "; }
  .ed-sec { padding: 4px 12px 12px; display: grid; gap: 10px; }
  .campo { display: grid; gap: 4px; }
  .campo > span { color: var(--suave); font-size: .78rem; }
  .editor input[type=text], .editor input[type=password], .editor textarea, .editor select {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--borde); background: rgba(0,0,0,.35); color: var(--texto); font: inherit;
  }
  .editor textarea { min-height: 70px; resize: vertical; }
  .editor input[type=color] { width: 100%; height: 34px; padding: 2px; border-radius: 8px; border: 1px solid var(--borde); background: rgba(0,0,0,.35); }
  .editor input[type=range] { width: 100%; }
  .check { display: flex; align-items: center; gap: 8px; }
  .btn { background: rgba(255,255,255,.09); border: 1px solid var(--borde); color: var(--texto); padding: 8px 12px; border-radius: 9px; cursor: pointer; font-size: .84rem; }
  .btn:hover { background: rgba(255,255,255,.16); }
  .btn.pri { background: linear-gradient(135deg, var(--acento), var(--acento2)); border: 0; font-weight: 700; color: #fff; }
  .btn.peli { color: #ff9a9a; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .fila-btn { display: flex; flex-wrap: wrap; gap: 6px; }
  .item { border: 1px solid var(--borde); border-radius: 10px; padding: 10px; display: grid; gap: 8px; background: rgba(0,0,0,.2); }
  .item.sel { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento); }
  .item-cab { display: flex; align-items: center; gap: 8px; }
  .item-cab img { width: 34px; height: 34px; object-fit: contain; border-radius: 6px; background: rgba(255,255,255,.08); }
  .item-cab b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ayuda { color: var(--suave); font-size: .78rem; line-height: 1.45; }
  .ed-pie { padding: 12px 14px; border-top: 1px solid var(--borde); display: flex; gap: 8px; }
  .ed-pie .pri { flex: 1; }
  .ed-asa { position: absolute; left: 0; top: 50%; transform: translate(-100%, -50%); display: none; }
  @media (max-width: 700px) {
    .editor { top: auto; height: 62vh; width: 100%; border-left: 0; border-top: 1px solid var(--borde); border-radius: 18px 18px 0 0; }
    .editor.min { transform: translateY(calc(100% - 46px)); }
    body.editando #app { padding-bottom: 66vh; }
  }
</style>
</head>
<body>

<div class="fondo animado" id="fondo"></div>
<video id="fondo-video" class="fondo-video" muted loop playsinline></video>
<div class="velo" id="velo"></div>

<div id="stickers"></div>

<div id="entrar"><span id="entrar-texto"></span></div>

<div id="app">
  <div class="mute" id="mute">
    <button id="btn-mute" aria-label="Silenciar o activar sonido">
      <svg id="ico-mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    </button>
    <div class="vol-caja"><input type="range" id="volumen" min="0" max="1" step="0.01" value="0.6" aria-label="Volumen"></div>
  </div>

  <main class="columna">
    <section class="perfil">
      <div class="avatar-caja" id="avatar-caja"></div>
      <h1 id="nombre"></h1>
      <div class="usuario" id="usuario"></div>
      <div class="lugar" id="lugar"></div>
      <p class="bio" id="bio"></p>
      <div class="redes" id="redes"></div>
    </section>

    <section class="player" id="player">
      <div class="player-fila">
        <div class="portada" id="portada"></div>
        <div class="p-centro">
          <div id="tema">—</div>
          <div class="barra-fila">
            <span id="t-actual">0:00</span>
            <input type="range" id="progreso" min="0" max="100" value="0" step="0.1" aria-label="Progreso">
            <span id="t-total">0:00</span>
          </div>
        </div>
        <div class="controles">
          <button id="anterior" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
          <button id="pp" aria-label="Reproducir o pausar"><svg id="ico-pp" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
          <button id="siguiente" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg></button>
        </div>
      </div>
      <ul class="lista" id="lista"></ul>
    </section>

    <a class="ir-handycam" id="ir-handycam"></a>

    <section id="handycam">
      <div class="seccion-titulo">
        <h2 id="handycam-titulo"></h2>
        <p id="handycam-sub"></p>
      </div>
      <div class="hc" id="hc">
        <div class="hc-barra">
          <div class="hc-tabs" id="hc-tabs"></div>

  for (let i = 2; i < arguments.length; i++) {

}

function reproducir() { audio.play().catch(function () {}); }

function irA(n) {
  const total = D.canciones.length; if (!total) return;

function aplicarCanciones() {

  if (actual >= cs.length) actual = 0;

  const ul = $("#lista"); ul.innerHTML = "";

const SVG_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

const VID = { original: false, reproduciendo: false, drive: [], grupos: [], sel: -1, pagina: 0, actual: null, cargando: false, error: "", firma: "" };

function idCarpeta(s) {
  s = (s || "").trim();
  const m = s.match(/\/folders\/([\w-]{10,})/) || s.match(/[?&]id=([\w-]{10,})/);
  return m ? m[1] : s;
}
function normalizarVideo(f) {
  let fecha = "";
  if (f.createdTime) { try { fecha = new Date(f.createdTime).toLocaleDateString("es-AR", { month: "long", year: "numeric" }); } catch (e) {} }
  return {
    id: f.id,
    titulo: (f.name || "Sin título").replace(/\.[^.]+$/, ""),
    fecha: fecha,
    thumb: f.thumbnailLink ? f.thumbnailLink.replace(/=s\d+$/, "=w480") : ""
  };
}
async function driveGet(url) {
  const r = await fetch(url);
  if (!r.ok) {
    let m = "";
    try { m = (await r.json()).error.message; } catch (e) {}
    throw new Error(m || ("Error " + r.status));
  }
  return r.json();
}
async function driveListar(carpetaId, key) {
  let out = [], token = "";
  do {
    const url = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent("'" + carpetaId + "' in parents and trashed=false") +
      "&fields=" + encodeURIComponent("nextPageToken,files(id,name,mimeType,thumbnailLink,createdTime)") +
      "&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true&key=" + encodeURIComponent(key) +
      (token ? "&pageToken=" + encodeURIComponent(token) : "");
    const j = await driveGet(url);
    out = out.concat(j.files || []); token = j.nextPageToken || "";
  } while (token);
  return out;
}
async function cargarCarpeta(id, nombre, key, grupos, prof) {
  const items = await driveListar(id, key);
  const vids = items.filter(function (f) { return /^video\//.test(f.mimeType); });
  vids.sort(function (a, b) { return a.name.localeCompare(b.name, "es", { numeric: true }); });
  if (vids.length) grupos.push({ nombre: nombre, videos: vids.map(normalizarVideo) });
  const subs = items.filter(function (f) { return f.mimeType === "application/vnd.google-apps.folder"; });
  subs.sort(function (a, b) { return a.name.localeCompare(b.name, "es", { numeric: true }); });
  for (const sub of subs) if (prof < 3) await cargarCarpeta(sub.id, sub.name, key, grupos, prof + 1);
}
async function cargarDrive(forzar) {
  const d = D.drive || {};
  const carpetas = (d.carpetas || []).filter(function (c) { return c.id; });
  const firma = JSON.stringify([d.apiKey, carpetas.map(function (c) { return c.id; })]);
  if (!forzar && firma === VID.firma) return;
  VID.firma = firma; VID.error = ""; VID.drive = [];
  if (!d.apiKey || !carpetas.length) { aplicarVideos(); return { total: 0 }; }
  VID.cargando = true; aplicarVideos();
  const grupos = [];
  try {
    for (const c of carpetas) {
      let nombre = c.nombre;
      if (!nombre) {
        try { nombre = (await driveGet("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(c.id) + "?fields=name&supportsAllDrives=true&key=" + encodeURIComponent(d.apiKey))).name; }
        catch (e) { nombre = "Videos"; }
      }
      await cargarCarpeta(c.id, nombre, d.apiKey, grupos, 0);
    }
    VID.drive = grupos;
  } catch (e) {
    VID.error = "No pude leer la carpeta de Drive: " + e.message;
    VID.firma = "";
  }
  VID.cargando = false;
  aplicarVideos();
  return { total: grupos.reduce(function (n, g) { return n + g.videos.length; }, 0), error: VID.error };
}

function listaActual() {
  if (VID.sel < 0) return VID.grupos.reduce(function (a, g) { return a.concat(g.videos); }, []);
  return (VID.grupos[VID.sel] || { videos: [] }).videos;
}

let stickerEls = [];
let zTop = 31;
let seleccionado = null;

function posicionar(el, s) {
  el.style.left = s.x + "%"; el.style.top = s.y + "%";
  el.style.width = s.ancho + "px";
  el.style.setProperty("--rot", (s.rotacion || 0) + "deg");
}

function seleccionar(id) {
  seleccionado = id;
  stickerEls.forEach(function (el) { el.classList.toggle("sel", el._s.id === id); });
  document.querySelectorAll("[data-sid]").forEach(function (n) {
    const si = n.getAttribute("data-sid") === id;
    n.classList.toggle("sel", si);
    if (si && modoEditar) { const d = n.closest("details"); if (d) d.open = true; n.scrollIntoView({ block: "nearest" }); }
  });
}

function activarArrastre(el, s) {
  el.addEventListener("pointerdown", function (e) {
    if (!(modoEditar || s.modo === "arrastrar")) return;
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const dx = e.clientX - (s.x / 100) * innerWidth, dy = e.clientY - (s.y / 100) * innerHeight;
    el.style.zIndex = ++zTop; el.arrastrando = true;
    if (modoEditar) seleccionar(s.id);
    function mover(ev) {
      s.x = Math.min(100, Math.max(0, ((ev.clientX - dx) / innerWidth) * 100));
      s.y = Math.min(100, Math.max(0, ((ev.clientY - dy) / innerHeight) * 100));
      posicionar(el, s);
    }
    function soltar() {
      el.arrastrando = false;
      el.removeEventListener("pointermove", mover); el.removeEventListener("pointerup", soltar); el.removeEventListener("pointercancel", soltar);
      if (modoEditar) { sucio = true; if (typeof actualizarEstado === "function") actualizarEstado(); }
    }
    el.addEventListener("pointermove", mover); el.addEventListener("pointerup", soltar); el.addEventListener("pointercancel", soltar);
  });
}

function aplicarStickers() {
  const capa = $("#stickers"); capa.innerHTML = ""; stickerEls = [];
  D.stickers.forEach(function (s) {
    const el = h("img", { class: "sticker", src: rutaUrl(s.archivo), alt: "", draggable: "false" });
    if (s.modo === "arrastrar") el.classList.add("mov");
    el._s = s; el._ox = 0; el._oy = 0; el._fase = Math.random() * 6.28;
    posicionar(el, s); activarArrastre(el, s);
    if (s.id === seleccionado && modoEditar) el.classList.add("sel");
    capa.append(el); stickerEls.push(el);
  });
}

let mx = -1e5, my = -1e5;
addEventListener("pointermove", function (e) { mx = e.clientX; my = e.clientY; }, { passive: true });

function bucle(t) {
  for (let i = 0; i < stickerEls.length; i++) {
    const el = stickerEls[i], s = el._s;
    let tx = 0, ty = 0;
    if (!modoEditar && !el.arrastrando) {
      if (s.modo === "esquivar" || s.modo === "atraer") {
        const cx = (s.x / 100) * innerWidth, cy = (s.y / 100) * innerHeight;
        const dx = cx - mx, dy = cy - my, d = Math.hypot(dx, dy) || 1, R = Math.max(130, s.ancho * 1.6);
        if (d < R) {
          const f = 1 - d / R, fz = s.fuerza || 90;
          if (s.modo === "esquivar") { tx = (dx / d) * f * fz; ty = (dy / d) * f * fz; }
          else { const mag = Math.min(f * fz, d * 0.7); tx = (-dx / d) * mag; ty = (-dy / d) * mag; }
        }
      }
      if (s.flotar) { ty += Math.sin(t / 900 + el._fase) * 6; tx += Math.cos(t / 1300 + el._fase) * 3; }
    }
    const nx = el._ox + (tx - el._ox) * 0.12, ny = el._oy + (ty - el._oy) * 0.12;
    if (Math.abs(nx - el._ox) > 0.01 || Math.abs(ny - el._oy) > 0.01 || tx || ty) {
      el._ox = nx; el._oy = ny;
      el.style.setProperty("--ox", nx.toFixed(2) + "px"); el.style.setProperty("--oy", ny.toFixed(2) + "px");
    }
  }
  requestAnimationFrame(bucle);
}

/* ----- subir archivos (quedan pendientes hasta "Guardar") ----- */
function reducirImagen(file, max, tipo) {
  return new Promise(function (ok, mal) {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { URL.revokeObjectURL(url); b ? ok(b) : mal(new Error("No se pudo procesar la imagen")); }, tipo, 0.9);
    };
    img.onerror = function () { mal(new Error("Imagen inválida")); };
    img.src = url;
  });
}

async function adjuntar(file, carpeta, max) {
  const punto = file.name.lastIndexOf(".");
  const base = limpiarNombre(punto > 0 ? file.name.slice(0, punto) : file.name);
  let ext = punto > 0 ? file.name.slice(punto + 1).toLowerCase() : "bin";
  let blob = file;
  if (max && /^image\//.test(file.type) && file.type !== "image/gif" && file.type !== "image/svg+xml") {
    const tipo = file.type === "image/jpeg" ? "image/jpeg" : "image/png";
    blob = await reducirImagen(file, max, tipo);
    ext = tipo === "image/jpeg" ? "jpg" : "png";
  }
  if (blob.size > 24 * 1024 * 1024) throw new Error("El archivo pesa más de 24 MB. Usá uno más liviano.");
  const ruta = carpeta + "/" + Date.now().toString(36) + "-" + base + "." + ext;
  pendientes[ruta] = { blob: blob, blobUrl: URL.createObjectURL(blob), subido: false };
  return ruta;
}
async function subir(file, carpeta, max, alTerminar) {
  try { setEstado("Preparando archivo…"); const r = await adjuntar(file, carpeta, max); alTerminar(r); sucio = true; actualizarEstado(); }
  catch (e) { setEstado(e.message, "mal"); }
}

/* ----- guardar en GitHub ----- */
function errorGitHub(estado, detalle) {
  if (estado === 401) return "El token no es válido o venció. Creá uno nuevo.";
  if (estado === 403 || estado === 404) return "El token no tiene acceso a este repositorio (o los datos de conexión están mal). Revisá usuario, repositorio y que el permiso sea Contents: Read and write.";
  if (estado === 409) return "Hubo un choque con otro cambio. Probá guardar de nuevo.";
  if (estado === 422) return "GitHub rechazó el archivo. " + (detalle || "");
  return "Error de GitHub (" + estado + ").";
}
function blobABase64(b) {
  return new Promise(function (ok, mal) {
    const r = new FileReader();
    r.onload = function () { ok(String(r.result).split(",")[1]); };
    r.onerror = function () { mal(new Error("No se pudo leer el archivo")); };
    r.readAsDataURL(b);
  });
}
function textoABase64(s) {
  const bytes = new TextEncoder().encode(s); let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
async function ghSubir(ruta, b64, mensaje) {
  const base = "https://api.github.com/repos/" + conexion.owner + "/" + conexion.repo + "/contents/" + ruta.split("/").map(encodeURIComponent).join("/");
  const cab = { Authorization: "Bearer " + conexion.token, Accept: "application/vnd.github+json" };
  let sha;
  const g = await fetch(base + "?ref=" + encodeURIComponent(conexion.branch), { headers: cab });
  if (g.ok) sha = (await g.json()).sha;
  else if (g.status !== 404) throw new Error(errorGitHub(g.status));
  const r = await fetch(base, {
    method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, cab),
    body: JSON.stringify({ message: mensaje, content: b64, branch: conexion.branch, sha: sha })
  });
  if (!r.ok) { let d = ""; try { d = (await r.json()).message; } catch (e) {} throw new Error(errorGitHub(r.status, d)); }
}

let guardando = false;
async function guardar() {
  if (guardando) return;
  if (!conexion.token) { setEstado("Falta el token (sección Conexión)", "mal"); return; }
  guardando = true; $("#ed-guardar").disabled = true;
  try {
    const lista = Object.keys(pendientes).filter(function (p) { return !pendientes[p].subido; });
    for (let i = 0; i < lista.length; i++) {
      setEstado("Subiendo archivo " + (i + 1) + " de " + lista.length + "…");
      await ghSubir(lista[i], await blobABase64(pendientes[lista[i]].blob), "Subir " + lista[i]);
      pendientes[lista[i]].subido = true;
    }
    setEstado("Guardando configuración…");
    await ghSubir("datos.json", textoABase64(JSON.stringify(D, null, 2)), "Actualizar la página");
    sucio = false;
    setEstado("Guardado ✓ (se ve en 1–2 minutos)", "bien");
  } catch (e) {
    setEstado(e.message || "No se pudo guardar", "mal");
  } finally {
    guardando = false; $("#ed-guardar").disabled = false;
  }
}
